[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "blockdynamicnetworks"
version = "0.1.0"
description = "Statistical inference tools for block network models"
requires-python = ">=3.10"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/blockdynamicnetworks"]